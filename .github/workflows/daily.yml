name: דוח יומי — שני-שישי 5:00

on:
  # schedule הושבת — הדוח מתוזמן עכשיו דרך Claude /schedule (סוכן ענן)
  workflow_dispatch:

jobs:
  daily-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests yfinance truststore

      - name: Run daily report
        env:
          NTFY_TOPIC:       ${{ secrets.NTFY_TOPIC }}
          WHATSAPP_PHONE:   ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          DASHBOARD_URL:    ${{ secrets.DASHBOARD_URL || 'https://rotemstainai23.github.io/portfolio' }}
          GROQ_API_KEY:     ${{ secrets.GROQ_API_KEY }}
        run: python scripts/daily_report.py

      - name: שמירת דוח יומי ל-git
        run: |
          git config user.name "Daily Report Bot"
          git config user.email "bot@portfolio"
          git add analyses/_daily/ portfolio.json
          git diff --cached --quiet || git commit -m "chore: daily report $(date +%Y-%m-%d)"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
