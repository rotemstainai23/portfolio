name: דוח יומי — שני-שישי 5:00

on:
  schedule:
    # 02:00 UTC = ~05:00 שעון ישראל (קיץ). שני-שישי. GitHub cron ב-UTC; כוונן אם השעה זזה ב-DST.
    - cron: '0 2 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests yfinance truststore

      - name: Run daily report
        env:
          NTFY_TOPIC:       ${{ secrets.NTFY_TOPIC }}
          WHATSAPP_PHONE:   ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          DASHBOARD_URL:    ${{ secrets.DASHBOARD_URL || 'https://rotemstainai23.github.io/portfolio' }}
          GROQ_API_KEY:     ${{ secrets.GROQ_API_KEY }}
        run: python scripts/daily_report.py

      - name: צור אינדקס reviews סטטי לענן
        run: python scripts/build_reviews_index.py

      - name: שמירת דוח יומי ל-git
        run: |
          git config user.name "Daily Report Bot"
          git config user.email "bot@portfolio"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git add analyses/_daily/ portfolio.json analyses/_reviews_index.json
          git diff --cached --quiet || git commit -m "chore: daily report $(date +%Y-%m-%d)"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
