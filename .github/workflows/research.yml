name: מחקר מניה on-demand

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: 'טיקר לניתוח (לדוגמה AAPL)'
        required: true

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r engine/requirements.txt

      - name: Run research engine
        env:
          NTFY_TOPIC:     ${{ secrets.NTFY_TOPIC }}
          GROQ_API_KEY:   ${{ secrets.GROQ_API_KEY }}
          DASHBOARD_URL:  ${{ secrets.DASHBOARD_URL || 'https://rotemstainai23.github.io/portfolio' }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'portfolio research rotemstain23@gmail.com' }}
          TICKER:         ${{ inputs.ticker }}
        run: python -m engine.run --mode research --ticker "$TICKER"

      - name: שמירת מחקר ל-git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TICKER:       ${{ inputs.ticker }}
        run: |
          git config user.name "Research Bot"
          git config user.email "bot@portfolio"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git add analyses/_research/
          git diff --cached --quiet || { git commit -m "research: $TICKER $(date +%Y-%m-%d)" && git push; }
