name: דוח CEO שבועי — ראשון 5:00

on:
  schedule:
    - cron: '0 2 * * 0'   # ~05:00 שעון ישראל, ראשון. GitHub cron ב-UTC.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sunday-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run CEO weekly report
        env:
          NTFY_TOPIC:       ${{ secrets.NTFY_TOPIC }}
          WHATSAPP_PHONE:   ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          DASHBOARD_URL:    ${{ secrets.DASHBOARD_URL }}
          GROQ_API_KEY:     ${{ secrets.GROQ_API_KEY }}
        run: python scripts/sunday_report.py

      - name: Commit weekly report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "portfolio-bot"
          git config user.email "bot@portfolio"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git add analyses/_weekly/ || true
          git diff --staged --quiet || { git commit -m "auto: CEO weekly report $(date +%Y-%m-%d)" && git push; }
