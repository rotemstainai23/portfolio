<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Portfolio">
<meta name="theme-color" content="#8b5cf6">
<title>Portfolio OS</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#080d1a;--surface:#0e1528;--surface2:rgba(14,21,40,.75);
  --border:rgba(148,163,184,.07);--border2:rgba(148,163,184,.13);
  --glass:rgba(148,163,184,.055);--glass-b:rgba(148,163,184,.09);
  --text:#e2e8f5;--muted:#64748b;--muted2:#94a3b8;
  --blue:#8b5cf6;--green:#34d399;--red:#fb7185;--orange:#f59e0b;--yellow:#fbbf24;
  --grad:linear-gradient(135deg,#8b5cf6,#60a5fa);
  --nav:56px;--hdr:52px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Heebo,sans-serif;font-size:14px}

/* ── header ── */
header{
  position:fixed;top:0;inset-inline:0;
  height:var(--hdr);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;padding-top:env(safe-area-inset-top,0px);
  background:rgba(8,13,26,.92);
  backdrop-filter:blur(24px) saturate(180%);
  border-bottom:1px solid var(--border);
  z-index:100;
}
.hdr-title{font-size:16px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hdr-badge{display:none;background:var(--red);color:#fff;font-size:10px;font-weight:800;border-radius:20px;padding:2px 8px;margin-inline-start:6px;-webkit-text-fill-color:#fff}
.hdr-badge.show{display:inline-block}
.hdr-time{font-size:11px;color:var(--muted)}

/* ── content ── */
#app{
  position:fixed;
  top:var(--hdr);
  inset-inline:0;
  bottom:calc(var(--nav) + var(--safe-b));
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
.tab{display:none;padding-bottom:24px;min-height:100%}
.tab.active{display:block}

/* ── bottom nav ── */
nav{
  position:fixed;bottom:0;inset-inline:0;
  height:calc(var(--nav) + var(--safe-b));
  padding-bottom:var(--safe-b);
  background:rgba(8,13,26,.95);
  backdrop-filter:blur(24px) saturate(180%);
  border-top:1px solid var(--border);
  display:flex;align-items:stretch;
  z-index:100;
}
.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:4px;
  background:none;border:none;cursor:pointer;
  color:var(--muted);transition:color .18s;padding:0;
  -webkit-appearance:none;
}
.nav-btn.active{color:var(--blue)}
.nav-btn svg{width:20px;height:20px;stroke-width:2}
.nav-btn span{font-size:10px;font-weight:700;font-family:Heebo,sans-serif}
.nav-dot{
  width:4px;height:4px;border-radius:50%;background:var(--blue);
  position:absolute;bottom:6px;opacity:0;transition:opacity .18s;
}
.nav-btn.active .nav-dot{opacity:1}

/* ── cards & grids ── */
.card{
  background:var(--glass);backdrop-filter:blur(24px) saturate(180%);
  border:1px solid var(--glass-b);border-radius:16px;padding:16px;
  margin:0 14px 10px;transition:transform .2s;
}
.card:active{transform:scale(.98)}
.card.alert{border-color:rgba(251,113,133,.35);box-shadow:0 0 16px rgba(251,113,133,.08)}
.sec-hdr{padding:16px 16px 8px;font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.09em}

/* alert bar */
.alert-bar{
  margin:12px 14px;padding:10px 14px;
  background:rgba(251,113,133,.1);border:1px solid rgba(251,113,133,.28);
  border-radius:12px;color:var(--red);font-size:12px;font-weight:700;
  display:flex;align-items:center;gap:8px;
}

/* KPI strip */
.kpi-strip{display:flex;gap:1px;background:var(--border);border-bottom:1px solid var(--border);border-top:1px solid var(--border);margin-bottom:12px}
.kpi{flex:1;padding:12px 8px;background:var(--surface);text-align:center}
.kpi .v{font-size:18px;font-weight:800}
.kpi .l{font-size:10px;color:var(--muted);margin-top:2px}

/* flow row */
.flow-row{display:flex;gap:6px;overflow-x:auto;padding:0 14px 4px;-webkit-overflow-scrolling:touch}
.flow-row::-webkit-scrollbar{display:none}
.flow-node{background:var(--glass);border:1px solid var(--glass-b);border-radius:12px;padding:10px 14px;min-width:110px;flex-shrink:0}
.fn-title{font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.fn-val{font-size:13px;font-weight:800}
.fn-sub{font-size:10px;color:var(--muted2);margin-top:2px}
.flow-arr{display:flex;align-items:center;color:var(--muted);font-size:16px;flex-shrink:0;padding-top:12px}

/* holdings card */
.h-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.h-ticker{font-size:17px;font-weight:800}
.h-name{font-size:11px;color:var(--muted2)}
.h-price{font-size:16px;font-weight:700;text-align:left}
.h-chg{font-size:13px;font-weight:700;text-align:left}
.bar-track{height:3px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;margin:6px 0}
.bar-fill{height:100%;border-radius:3px;width:0;transition:width .8s cubic-bezier(.34,1.56,.64,1) .2s}
.bar-fill.up{background:linear-gradient(90deg,#34d399,#6ee7b7)}
.bar-fill.dn{background:linear-gradient(90deg,#fb7185,#fca5a5)}
.bar-fill.flat{background:rgba(148,163,184,.3)}
.h-meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;border:1px solid}
.pill-sec{color:var(--muted2);border-color:var(--border2);background:transparent}
.pill-layer-g{color:#34d399;border-color:rgba(52,211,153,.3);background:rgba(52,211,153,.08)}
.pill-layer-s{color:#60a5fa;border-color:rgba(96,165,250,.3);background:rgba(96,165,250,.08)}
.pill-layer-c{color:#8b5cf6;border-color:rgba(139,92,246,.3);background:rgba(139,92,246,.08)}
.pill-layer-x{color:#f59e0b;border-color:rgba(245,158,11,.3);background:rgba(245,158,11,.08)}
.pill-rsi-ob{color:#fb7185;border-color:rgba(251,113,133,.3);background:rgba(251,113,133,.08)}
.pill-rsi-os{color:#34d399;border-color:rgba(52,211,153,.3);background:rgba(52,211,153,.08)}
.pill-vol{color:#8b5cf6;border-color:rgba(139,92,246,.3);background:rgba(139,92,246,.08)}
.pill-earn{color:#f59e0b;border-color:rgba(245,158,11,.3);background:rgba(245,158,11,.08)}
.pill-alert{color:#fb7185;border-color:rgba(251,113,133,.35);background:rgba(251,113,133,.08)}

/* watchlist card */
.wl-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.wl-ticker{font-size:16px;font-weight:800}
.wl-co{font-size:11px;color:var(--muted2);margin-top:1px}
.wl-verdict{font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;border:1px solid}
.verdict-WATCH{color:#34d399;border-color:rgba(52,211,153,.3);background:rgba(52,211,153,.08)}
.verdict-WAIT{color:#94a3b8;border-color:var(--border2);background:transparent}
.verdict-SKIP{color:#fb7185;border-color:rgba(251,113,133,.3);background:rgba(251,113,133,.08)}
.wl-prices{display:flex;gap:16px;margin:8px 0;font-size:13px}
.wl-trigger-bar{margin:8px 0}
.wl-thesis{font-size:12px;color:var(--muted2);line-height:1.55;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}

/* groq panel */
.groq-panel{margin:0 14px 12px;padding:16px;background:linear-gradient(135deg,rgba(139,92,246,.08),rgba(96,165,250,.04));border:1px solid rgba(139,92,246,.28);border-top:3px solid var(--blue);border-radius:14px}
.groq-hdr{display:flex;align-items:center;gap:7px;margin-bottom:10px}
.groq-dot{width:7px;height:7px;border-radius:50%;background:var(--blue);animation:gp 2s ease infinite}
@keyframes gp{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.4)}}
.groq-title{font-size:12px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.groq-item{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid rgba(139,92,246,.1);font-size:12.5px;color:var(--muted2);line-height:1.6;opacity:0;animation:ir .4s ease forwards}
.groq-item:last-child{border:none}
.groq-dot2{width:5px;height:5px;border-radius:50%;background:var(--blue);flex-shrink:0;margin-top:7px}
@keyframes ir{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* weekly */
.week-kpi{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 12px}
.wkpi{flex:1;min-width:130px;background:var(--glass);border:1px solid var(--glass-b);border-radius:12px;padding:12px;text-align:center}
.wkpi .v{font-size:20px;font-weight:800}
.wkpi .l{font-size:10px;color:var(--muted);margin-top:2px}
.week-item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.week-item:last-child{border:none}

/* RSI ring (inline) */
.rsi-ring{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;position:relative;flex-shrink:0}
.rsi-ring::before{content:'';position:absolute;inset:6px;border-radius:50%;background:var(--surface)}
.rsi-n{position:relative;font-size:11px;font-weight:900;z-index:1}

/* empty & loading */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 24px;color:var(--muted);text-align:center;gap:10px}
.empty .icon{font-size:36px}
.empty .msg{font-size:14px;font-weight:700;color:var(--muted2)}
.empty .sub{font-size:12px}
.spinner{width:28px;height:28px;border:3px solid var(--border2);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* colors */
.up{color:var(--green)}.dn{color:var(--red)}.flat{color:var(--muted2)}
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center">
    <span class="hdr-title">Portfolio OS</span>
    <span class="hdr-badge" id="alert-badge"></span>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <span class="hdr-time" id="hdr-date"></span>
    <button onclick="openSettings()" style="background:none;border:none;cursor:pointer;color:var(--muted);padding:4px;display:flex;align-items:center" aria-label="הגדרות">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    </button>
  </div>
</header>

<div id="app">
  <div class="tab active" id="tab-daily">
    <div class="empty"><div class="spinner"></div></div>
  </div>
  <div class="tab" id="tab-holdings">
    <div class="empty"><div class="spinner"></div></div>
  </div>
  <div class="tab" id="tab-watchlist">
    <div class="empty"><div class="spinner"></div></div>
  </div>
  <div class="tab" id="tab-weekly">
    <div class="empty"><div class="spinner"></div></div>
  </div>
  <div class="tab" id="tab-research">
    <div class="empty"><div class="spinner"></div></div>
  </div>
  <div class="tab" id="tab-oracle">
    <div class="empty"><div class="spinner"></div></div>
  </div>
</div>

<nav>
  <button class="nav-btn active" id="nav-daily" onclick="show('daily')">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    <span>יומי</span>
    <div class="nav-dot"></div>
  </button>
  <button class="nav-btn" id="nav-holdings" onclick="show('holdings')">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/></svg>
    <span>תיק</span>
    <div class="nav-dot"></div>
  </button>
  <button class="nav-btn" id="nav-watchlist" onclick="show('watchlist')">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
    <span>ווצ'ליסט</span>
    <div class="nav-dot"></div>
  </button>
  <button class="nav-btn" id="nav-weekly" onclick="show('weekly')">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    <span>שבועי</span>
    <div class="nav-dot"></div>
  </button>
  <button class="nav-btn" id="nav-research" onclick="show('research')">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    <span>ניתוח</span>
    <div class="nav-dot"></div>
  </button>
  <button class="nav-btn" id="nav-oracle" onclick="show('oracle')">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
    <span>אורקל</span>
    <div class="nav-dot"></div>
  </button>
</nav>

<!-- מודל הגדרות -->
<div id="settings-modal" style="display:none;position:fixed;inset:0;z-index:200;background:rgba(8,13,26,.97);backdrop-filter:blur(24px);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)">
  <div style="padding:20px 18px;max-width:480px;margin:0 auto">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:28px">
      <span style="font-size:20px;font-weight:800">הגדרות</span>
      <button onclick="closeSettings()" style="background:var(--surface2);border:1px solid var(--border2);border-radius:50%;width:36px;height:36px;cursor:pointer;color:var(--muted2);font-size:18px;display:flex;align-items:center;justify-content:center">×</button>
    </div>

    <div style="margin-bottom:22px">
      <div style="font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px">כתובת Cloudflare Worker (מחירים חיים)</div>
      <input id="cfg-proxy" type="url" placeholder="https://portfolio-proxy.user.workers.dev" autocomplete="off" spellcheck="false" style="width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;color:var(--text);padding:12px 13px;font-size:14px;font-family:Heebo,sans-serif;outline:none;direction:ltr"/>
      <div style="font-size:11px;color:var(--muted);margin-top:5px">ה-Worker מחזיר מחירים חיים בלי שרת מקומי</div>
    </div>

    <div style="margin-bottom:28px">
      <div style="font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px">טוקן GitHub (portfolio-pwa)</div>
      <div style="display:flex;gap:8px">
        <input id="cfg-token" type="password" placeholder="ghp_..." autocomplete="off" spellcheck="false" style="flex:1;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;color:var(--text);padding:12px 13px;font-size:14px;font-family:Heebo,sans-serif;outline:none;direction:ltr"/>
        <button onclick="toggleTokenEye()" style="background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:0 14px;cursor:pointer;color:var(--muted2);font-size:16px">👁</button>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:5px">נשמר ב-localStorage בלבד, לא בגיט. נדרש להפעלת workflows מהנייד.</div>
    </div>

    <button onclick="saveSettings()" style="width:100%;background:var(--blue);color:#fff;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:800;font-family:Heebo,sans-serif;cursor:pointer;margin-bottom:8px">שמור</button>
    <button onclick="shareSettings()" style="width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:12px;font-size:14px;font-weight:700;font-family:Heebo,sans-serif;cursor:pointer;color:var(--muted2);margin-bottom:8px">📲 הפק קישור לנייד</button>
    <div id="cfg-status" style="text-align:center;font-size:12px;min-height:20px"></div>

    <div style="margin-top:20px;padding-top:18px;border-top:1px solid var(--border)">
      <button onclick="testProxy()" style="width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:12px;font-size:13px;font-weight:700;font-family:Heebo,sans-serif;cursor:pointer;color:var(--muted2)">בדוק Worker (AAPL)</button>
      <div id="cfg-test" style="text-align:center;font-size:12px;margin-top:8px;min-height:18px"></div>
    </div>

    <div style="margin-top:20px;padding-top:18px;border-top:1px solid var(--border)">
      <div style="font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px">הפעלת Workflows ידנית</div>
      <div style="display:flex;gap:8px">
        <button onclick="triggerWorkflow('daily.yml','יומי')" style="flex:1;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:11px 8px;font-size:12px;font-weight:700;font-family:Heebo,sans-serif;cursor:pointer;color:var(--muted2)">רענן יומי</button>
        <button onclick="triggerWorkflow('sunday.yml','שבועי')" style="flex:1;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:11px 8px;font-size:12px;font-weight:700;font-family:Heebo,sans-serif;cursor:pointer;color:var(--muted2)">רענן שבועי</button>
        <button onclick="triggerWorkflow('saturday.yml','סקנר')" style="flex:1;background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:11px 8px;font-size:12px;font-weight:700;font-family:Heebo,sans-serif;cursor:pointer;color:var(--muted2)">סקנר</button>
      </div>
      <div id="cfg-wf" style="text-align:center;font-size:12px;margin-top:8px;min-height:18px"></div>
    </div>
  </div>
</div>

<script>
var _daily = null, _port = null, _weekly = null;
var _live = {};            // מפת מחירים חיים מה-proxy: {TICKER:{price,chg_pct,prev}}
var _loaded = {};

/* כתובת Cloudflare Worker למחירים חיים. ניתן לדרוס מההגדרות (localStorage) בלי לערוך קוד. */
function priceProxy(){ try { return localStorage.getItem('price_proxy_url') || ''; } catch(e){ return ''; } }

/* מעדכן את שורת הכותרת — תאריך + badge חי אם פעיל */
var _liveOn = false;
function tickDate(){
  var now  = new Date();
  var dstr = now.toLocaleDateString('he-IL', {weekday:'short', day:'numeric', month:'short'});
  var t = $('hdr-date'); if (!t) return;
  t.dataset.date = dstr;
  if (_liveOn) t.innerHTML = '<span style="color:var(--green)">● חי</span> · ' + dstr;
  else t.textContent = dstr;
}

function $(id){ return document.getElementById(id); }

/* מחזיר מחיר/שינוי חי אם קיים, אחרת נופל לסנפשוט היומי */
function liveOr(tk, price, chg){
  var L = _live[tk];
  if (L && L.price != null) return { price:L.price, chg: L.chg_pct!=null?L.chg_pct:chg, live:true };
  return { price:price, chg:chg, live:false };
}

function pct(v, dec){
  dec = dec == null ? 1 : dec;
  if (v == null) return '—';
  return (v > 0 ? '+' : '') + Number(v).toFixed(dec) + '%';
}
function rsiColor(v){
  if (v == null) return 'var(--muted)';
  if (v <= 35) return '#34d399';
  if (v >= 65) return '#fb7185';
  return '#f59e0b';
}
function layerPill(l){
  if (!l) return '';
  var cls = l === 'Growth' ? 'pill-layer-g' : l === 'Stability' ? 'pill-layer-s' : l === 'Core' ? 'pill-layer-c' : 'pill-layer-x';
  return '<span class="pill ' + cls + '">' + l + '</span>';
}

/* ── navigation ── */
function show(name){
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
  document.querySelectorAll('.nav-btn').forEach(function(b){ b.classList.remove('active'); });
  $('tab-' + name).classList.add('active');
  $('nav-' + name).classList.add('active');
  if (!_loaded[name]) { _loaded[name] = true; renderTab(name); }
  /* smooth scroll to top */
  $('app').scrollTop = 0;
}

/* ── data fetch ── */
async function fetchJSON(path){
  try {
    var r = await fetch(path + '?_=' + Date.now(), {cache: 'no-cache'});
    if (!r.ok) return null;
    return await r.json();
  } catch(e){ return null; }
}

/* מושך מחירים חיים לכל הטיקרים (אחזקות + ווצ'ליסט) דרך ה-Worker, וממזג ל-_live */
async function loadLivePrices(){
  var proxy = priceProxy();
  if (!proxy) return false;
  var set = {};
  (_port && _port.holdings || []).forEach(function(h){ var t=h.symbol||h.ticker; if(t) set[t.toUpperCase()]=1; });
  (_port && _port.watchlist || []).forEach(function(w){ var t=w.symbol||w.ticker; if(t) set[t.toUpperCase()]=1; });
  (_daily && _daily.holdings || []).forEach(function(h){ if(h.ticker) set[h.ticker.toUpperCase()]=1; });
  var syms = Object.keys(set);
  if (!syms.length) return false;
  var url = proxy.replace(/\/+$/,'') + '/?quotes=' + encodeURIComponent(syms.join(','));
  try {
    var r = await fetch(url, {cache:'no-store'});
    if (!r.ok) return false;
    _live = await r.json() || {};
    return true;
  } catch(e){ return false; }
}

/* מסמן בכותרת שמחירים חיים נטענים */
function setLiveBadge(on){
  _liveOn = !!on;
  var t = $('hdr-date');
  if (on) t.innerHTML = '<span style="color:var(--green)">● חי</span> · ' + t.dataset.date;
}

async function loadAll(){
  tickDate();

  var [d, p, w] = await Promise.all([
    fetchJSON('analyses/_daily/daily_latest.json'),
    fetchJSON('portfolio.json'),
    fetchJSON('analyses/_weekly/ceo_weekly.json'),
  ]);
  _daily = d; _port = p; _weekly = w;

  /* alert badge */
  if (_daily && _daily.has_alerts && _daily.alert_tickers && _daily.alert_tickers.length) {
    var b = $('alert-badge');
    b.textContent = _daily.alert_tickers.length;
    b.classList.add('show');
  }

  renderTab('daily');

  /* מחירים חיים: טען, מזג, רנדר מחדש את הטאב הפעיל, ורענן כל 60 שנ' */
  if (await loadLivePrices()) {
    setLiveBadge(true);
    refreshActiveTab();
    setInterval(async function(){
      if (await loadLivePrices()) { setLiveBadge(true); refreshActiveTab(); }
    }, 60000);
  }
  setInterval(tickDate, 60000);
}

/* מוצא את הטאב הפעיל ומרנדר אותו מחדש (לאחר עדכון מחירים חיים) */
function refreshActiveTab(){
  var active = document.querySelector('.tab.active');
  if (!active) return;
  var name = active.id.replace('tab-','');
  renderTab(name);
}

function renderTab(name){
  if (name === 'daily')     renderDaily();
  if (name === 'holdings')  renderHoldings();
  if (name === 'watchlist') renderWatchlist();
  if (name === 'weekly')    renderWeekly();
  if (name === 'research')  renderResearch();
  if (name === 'oracle')    renderOracle();
}

  h += '<div class="sec-hdr">אחזקות — ' + (_live && Object.keys(_live).length ? 'מחיר חי' : D.generated_time) + '</div>';

/* ── HOLDINGS ── */
function renderHoldings(){
  var el = $('tab-holdings');
  if (!_port) { el.innerHTML = '<div class="empty"><div class="icon">📭</div><div class="msg">אין נתוני תיק</div></div>'; return; }

  /* merge daily prices */
  var dailyMap = {};
  if (_daily) _daily.holdings.forEach(function(h){ dailyMap[h.ticker] = h; });

  var holdings = _port.holdings || [];
  var cash = _port.cash || 0;

  /* שווי תיק, P&L חי, ושווי לפי שכבה */
  var mv = 0, cost = 0;
  var layerVal = {Stability:0, Growth:0, Speculation:0, Core:0};
  holdings.forEach(function(h){
    var tk = h.symbol || h.ticker;
    var e = liveOr(tk, (dailyMap[tk]||{}).price, null);
    var px = e.price != null ? e.price : h.buy_price;
    var qty = h.quantity || 0;
    var val = px * qty;
    mv += val; cost += (h.buy_price||0) * qty;
    if (h.layer && layerVal[h.layer] != null) layerVal[h.layer] += val;
    else if (h.layer) layerVal[h.layer] = val;
  });
  var totalVal = mv + cash;
  var pnl = mv - cost;
  var pnlPct = cost ? (pnl / cost * 100) : 0;
  var pc = pnl >= 0 ? 'up' : 'dn';

  var h = '<div class="kpi-strip">'
    + '<div class="kpi"><div class="v">$' + Math.round(totalVal).toLocaleString() + '</div><div class="l">שווי תיק</div></div>'
    + '<div class="kpi"><div class="v ' + pc + '">' + (pnl>=0?'+':'') + '$' + Math.round(pnl).toLocaleString() + '</div><div class="l">' + pct(pnlPct) + ' P&L</div></div>'
    + '<div class="kpi"><div class="v">$' + Math.round(cash).toLocaleString() + '</div><div class="l">מזומן</div></div>'
    + '</div>';

  /* התפלגות שכבות מול יעדים (ניהול סיכון) */
  var layerMeta = {
    Stability:   {t:'יציבות',  lo:25, hi:35, c:'#60a5fa'},
    Growth:      {t:'צמיחה',   lo:55, hi:65, c:'#34d399'},
    Speculation: {t:'ספקולציה',lo:5,  hi:10, c:'#f59e0b'},
    Core:        {t:'ליבה',    lo:0,  hi:100,c:'#8b5cf6'},
  };
  var cashPct = totalVal ? cash/totalVal*100 : 0;
  var distRows = '';
  Object.keys(layerMeta).forEach(function(k){
    if (!layerVal[k]) return;
    var m = layerMeta[k];
    var p = totalVal ? layerVal[k]/totalVal*100 : 0;
    var off = p < m.lo || p > m.hi;
    distRows += '<div style="margin-bottom:10px">'
      + '<div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px">'
      + '<span style="color:var(--muted2);font-weight:700">' + m.t + '</span>'
      + '<span style="font-weight:800;color:' + (off?'var(--orange)':m.c) + '">' + p.toFixed(1) + '%'
      + '<span style="color:var(--muted);font-weight:500;font-size:10px"> (' + m.lo + '-' + m.hi + '%)</span></span>'
      + '</div>'
      + '<div class="bar-track" style="margin:0"><div class="bar-fill" style="width:' + Math.min(p,100).toFixed(0) + '%;background:' + m.c + '"></div></div>'
      + '</div>';
  });
  distRows += '<div><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px">'
    + '<span style="color:var(--muted2);font-weight:700">מזומן</span>'
    + '<span style="font-weight:800;color:var(--muted2)">' + cashPct.toFixed(1) + '%<span style="color:var(--muted);font-weight:500;font-size:10px"> (5-10%)</span></span></div>'
    + '<div class="bar-track" style="margin:0"><div class="bar-fill" style="width:' + Math.min(cashPct,100).toFixed(0) + '%;background:rgba(148,163,184,.4)"></div></div></div>';
  h += '<div class="sec-hdr">התפלגות שכבות</div>'
    + '<div class="card">' + distRows + '</div>';

  h += '<div class="sec-hdr" style="display:flex;justify-content:space-between;align-items:center"><span>אחזקות' + (Object.keys(_live).length ? ' · מחיר חי' : (_daily ? ' · מחירי ' + _daily.generated_time : ' · מחירי כניסה')) + '</span><button onclick="openHoldingModal(null)" style="font-size:12px;font-weight:700;color:var(--blue);background:none;border:1.5px solid var(--blue);border-radius:8px;padding:4px 12px;cursor:pointer;font-family:inherit">+ הוסף</button></div>';

  holdings.forEach(function(hd){
    var tk  = hd.symbol || hd.ticker || '';
    var d   = dailyMap[tk] || {};
    var e   = liveOr(tk, d.price, d.chg_pct);
    var price = e.price != null ? e.price : hd.buy_price;
    var hasLive = e.price != null;
    var chg = e.chg;
    var cls = chg!=null ? (chg>0?'up':chg<0?'dn':'flat') : 'flat';
    var bw  = chg!=null ? Math.min(Math.abs(chg)/5*100,100).toFixed(1) : 0;
    var rsi = d.rsi!=null ? Math.round(d.rsi) : null;
    var rc  = rsiColor(d.rsi);

    var pills = '';
    if (hd.sector) pills += '<span class="pill pill-sec">' + hd.sector.split('/')[0].trim() + '</span>';
    if (hd.layer)  pills += layerPill(hd.layer);
    if (rsi!=null && rsi<=35) pills += '<span class="pill pill-rsi-os">RSI ' + rsi + '</span>';
    if (rsi!=null && rsi>=65) pills += '<span class="pill pill-rsi-ob">RSI ' + rsi + '</span>';
    if (d.vol_ratio!=null && d.vol_ratio>=1.5) pills += '<span class="pill pill-vol">×' + d.vol_ratio + '</span>';
    if (d.days_to_earnings!=null && d.days_to_earnings<=14) pills += '<span class="pill pill-earn">' + d.days_to_earnings + 'ד לדוח</span>';

    var buyInfo = '<span style="font-size:10px;color:var(--muted2)">כניסה $' + hd.buy_price + '</span>';
    var pnlPct  = hasLive && hd.buy_price ? ((price/hd.buy_price-1)*100).toFixed(1) : null;
    var pnlEl   = pnlPct!=null ? '<span style="font-size:11px;font-weight:700;color:' + (pnlPct>=0?'var(--green)':'var(--red)') + '">' + (pnlPct>=0?'+':'') + pnlPct + '%</span>' : '';

    h += '<div class="card">'
      + '<div class="h-row">'
      + '<div><div class="h-ticker">' + tk + '</div><div class="h-name">' + (hd.name||hd.sector||'') + '</div></div>'
      + '<div style="text-align:left"><div class="h-price">$' + (price?price.toFixed(2):'—') + '</div>'
      + (chg!=null ? '<div class="h-chg ' + cls + '">' + pct(chg) + '</div>' : pnlEl)
      + '</div></div>'
      + '<div class="bar-track"><div class="bar-fill ' + cls + '" style="width:' + bw + '%"></div></div>'
      + '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px">'
      + '<div class="h-meta">' + pills + '</div>'
      + '<div style="display:flex;align-items:center;gap:6px">' + buyInfo + (pnlPct&&hasLive ? pnlEl : '') + '<button onclick="openHoldingModal(\'' + tk + '\')" title="עדכן אחזקה" style="background:none;border:none;color:var(--muted);font-size:14px;cursor:pointer;padding:2px 4px;line-height:1">✏️</button></div>'
      + '</div></div>';
  });

  el.innerHTML = h;
}

/* ── WATCHLIST ── */
function renderWatchlist(){
  var el = $('tab-watchlist');
  if (!_port) { el.innerHTML = '<div class="empty"><div class="icon">📭</div><div class="msg">אין נתונים</div></div>'; return; }

  var dailyMap = {};
  if (_daily) _daily.holdings.concat(_daily.watchlist_triggers||[]).forEach(function(h){ dailyMap[h.ticker] = h; });
  /* also map watchlist_triggers */
  if (_daily && _daily.watchlist_triggers) _daily.watchlist_triggers.forEach(function(t){ dailyMap[t.ticker] = t; });

  var wl = _port.watchlist || [];
  if (!wl.length) { el.innerHTML = '<div class="empty"><div class="icon">👁️</div><div class="msg">ווצ\'ליסט ריק</div></div>'; return; }

  var h = '<div class="sec-hdr">ווצ\'ליסט — ' + wl.length + ' מניות</div>';

  wl.forEach(function(w){
    var tk  = w.symbol || w.ticker || '';
    var d   = dailyMap[tk] || {};
    var le  = liveOr(tk, d.current_price || d.price, null);
    var cur = le.price != null ? le.price : (d.current_price || d.price || null);
    var trig = parseFloat(w.trigger_price) || null;
    var dist = (cur && trig) ? ((cur - trig) / trig * 100) : null;
    var distCls = dist==null?'flat': Math.abs(dist)<3?'up':'flat';
    var verdict = (w.verdict||'WATCH').toUpperCase();
    var vCls = verdict==='WATCH'?'verdict-WATCH': verdict==='SKIP'?'verdict-SKIP':'verdict-WAIT';

    var trigBar = '';
    if (cur && trig) {
      var pos = Math.max(0, Math.min(100, (cur / trig - 0.97) / 0.06 * 100));
      trigBar = '<div class="wl-trigger-bar">'
        + '<div class="bar-track"><div class="bar-fill flat" style="width:' + pos.toFixed(0) + '%"></div></div>'

        + '<span style="font-size:15px;font-weight:800">' + r.ticker + '</span>'

        + (sc != null ? '<span style="font-weight:800;color:' + scColor + '">' + sc + '/10</span>' : '')
        + '<span style="font-size:11px;font-weight:700;color:' + vColor + '">' + vd + '</span>'

    }).join('');

    var scColor = function(sc){ return sc >= 7 ? 'var(--green)' : sc >= 5 ? 'var(--orange)' : 'var(--red)'; };
    var vColor  = function(vd){ return (vd||'').includes('BUY') ? 'var(--green)' : (vd||'').includes('PASS') || (vd||'').includes('SELL') ? 'var(--red)' : 'var(--orange)'; };

      var d = (r.generated||'').slice(0,10);

async function goResearch(){
  var t = ($('research-input').value||'').trim().toUpperCase();
  if (!t) return;

  var token = '';
  try { token = (localStorage.getItem('github_token')||'').trim(); } catch(e){}

  /* ללא טוקן: פתח תוצאה קיימת בלבד */
  if (!token) {
    window.location.href = 'templates/research.html?ticker=' + encodeURIComponent(t);
    return;
  }

  var btn = $('research-btn');
  var stat = $('research-status');
  if (btn) { btn.disabled = true; btn.textContent = '...'; }
  if (stat) { stat.style.color = 'var(--muted2)'; stat.textContent = 'שולח...'; }

  try {
    var r = await fetch(
      'https://api.github.com/repos/rotemstainai23/portfolio/actions/workflows/research.yml/dispatches',
      {
        method: 'POST',
        headers: {
          'Authorization': 'token ' + token,
          'Accept': 'application/vnd.github+json',
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({ ref: 'main', inputs: { ticker: t } }),
      }
    );
    if (r.status === 204) {
      if (stat) { stat.style.color = 'var(--green)'; stat.textContent = t + ' נשלח לענן. תוצאות בעוד 2-3 דק\''; }
      if (btn) { btn.textContent = 'נשלח'; }
      /* פתח אוטומטית את דף התוצאות אחרי השהייה */
      setTimeout(function(){ window.location.href = 'templates/research.html?ticker=' + encodeURIComponent(t); }, 3000);
    } else {
      var err = {}; try { err = await r.json(); } catch(_){}
      if (stat) { stat.style.color = 'var(--red)'; stat.textContent = 'שגיאה ' + r.status + ': ' + (err.message || r.statusText); }
      if (btn) { btn.disabled = false; btn.textContent = 'נתח'; }
    }
  } catch(e) {
    if (stat) { stat.style.color = 'var(--red)'; stat.textContent = 'שגיאת רשת: ' + e.message; }
    if (btn) { btn.disabled = false; btn.textContent = 'נתח'; }
  }
}

function _renderOracleMsgs(){
  var el = $('oracle-msgs');
  if (!el) return;
  if (!_oracleMsgs.length) {
    el.innerHTML = '<div style="text-align:center;color:var(--muted);padding:40px 0;font-size:12px">בחר quick-prompt למעלה או כתוב שאלה</div>';
    return;
  }
  el.innerHTML = _oracleMsgs.map(function(m){
    var isUser = m.role === 'user';
    return '<div style="margin:10px 0">'
      + '<div style="font-size:10px;color:var(--muted);font-weight:700;margin-bottom:4px">' + (isUser ? 'אתה' : 'אורקל') + '</div>'
      + '<div style="padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.65;white-space:pre-wrap;'
      + (isUser
          ? 'background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.22)'
          : 'background:var(--glass);border:1px solid var(--glass-b);color:var(--muted2)')
      + '">' + m.content + '</div>'
      + '</div>';
  }).join('');
  el.scrollTop = el.scrollHeight;
  /* גלול את האפליקציה למטה */
  try { $('app').scrollTop = $('app').scrollHeight; } catch(_){}
}

async function oracleSend(preset){
  var inp = $('oracle-input');
  var msg = (preset || (inp ? inp.value : '')).trim();
  if (!msg) return;
  if (inp) inp.value = '';

  var proxy = priceProxy();
  if (!proxy) { alert('הגדר כתובת Worker בהגדרות תחילה'); return; }

  _oracleMsgs.push({ role:'user', content:msg });
  _renderOracleMsgs();

  /* indicator טעינה */
  var msgsEl = $('oracle-msgs');
  var loader = document.createElement('div');
  loader.id = 'oracle-loader';
  loader.style.cssText = 'display:flex;align-items:center;gap:8px;padding:8px 0;color:var(--muted)';
  loader.innerHTML = '<div class="spinner" style="width:16px;height:16px;border-width:2px"></div><span style="font-size:12px">האורקל חושב...</span>';
  if (msgsEl) { msgsEl.appendChild(loader); msgsEl.scrollTop = msgsEl.scrollHeight; }

  try {
    var r = await fetch(proxy.replace(/\/+$/,'') + '/oracle', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      /* 12 הודעות אחרונות בלבד (חוסך טוקנים ב-Groq); הטוקן נדרש לכלי ניהול התיק */
      body:JSON.stringify({ messages: _oracleMsgs.slice(-12), token: (localStorage.getItem('github_token')||'').trim() }),
    });
    var ld = $('oracle-loader'); if (ld) ld.remove();
    var j = await r.json();
    _oracleMsgs.push({ role:'assistant', content: j.text || ('שגיאה: ' + (j.error||'תגובה ריקה')) });
  } catch(e) {
    var ld = $('oracle-loader'); if (ld) ld.remove();
    _oracleMsgs.push({ role:'assistant', content:'שגיאת רשת: ' + e.message });
  }
  _renderOracleMsgs();
}

/* מייצר קישור עם הגדרות מקודדות; פתיחה בנייד מייבאת אותן (אחרי אישור) */
function shareSettings(){
  try{
    var proxy = (document.getElementById('cfg-proxy').value||'').trim() || localStorage.getItem('price_proxy_url')||'';
    var token = (document.getElementById('cfg-token').value||'').trim() || localStorage.getItem('github_token')||'';
    if(!proxy && !token){ alert('אין הגדרות לשתף — שמור קודם.'); return; }
    var data = {};
    if(proxy) data.proxy = proxy;
    if(token) data.token = token;
    var url = location.origin + location.pathname + '#cfg=' + btoa(JSON.stringify(data));
    if(navigator.clipboard) navigator.clipboard.writeText(url);
    var s = document.getElementById('cfg-status');
    s.style.color='var(--green)'; s.textContent='קישור הועתק — פתח בנייד!';
    setTimeout(function(){ s.textContent=''; }, 3000);
  }catch(e){ alert('שגיאה: '+e.message); }
}

/* מייבא הגדרות מה-hash אם קיים (#cfg=BASE64), עם אישור מפורש: קישור זדוני יכול להחליף proxy ולגנוב טוקן */
function importSettingsFromHash(){
  try{
    var h = location.hash;
    if(!h.startsWith('#cfg=')) return;
    var data = JSON.parse(atob(h.slice(5)));
    /* מנקה את ה-hash מיד כדי שהטוקן לא יישאר בהיסטוריית הדפדפן */
    history.replaceState(null,'',location.pathname+location.search);
    var desc = [];
    if(data.proxy) desc.push('Worker: ' + data.proxy);
    if(data.token) desc.push('טוקן GitHub');
    if(!desc.length) return;
    if(!confirm('לייבא הגדרות מהקישור?\n' + desc.join('\n'))) return;
    if(data.proxy) localStorage.setItem('price_proxy_url', data.proxy);
    if(data.token) localStorage.setItem('github_token',   data.token);
    setTimeout(function(){
      var s = document.getElementById('cfg-status');
      if(s){ s.style.color='var(--green)'; s.textContent='הגדרות יובאו!'; setTimeout(function(){ s.textContent=''; },3000); }
    }, 800);
  }catch(e){}
}

function saveSettings(){
  try{
    var proxy=document.getElementById('cfg-proxy').value.trim();
    var token=document.getElementById('cfg-token').value.trim();
    if(proxy) localStorage.setItem('price_proxy_url',proxy); else localStorage.removeItem('price_proxy_url');
    if(token) localStorage.setItem('github_token',token); else localStorage.removeItem('github_token');
    var s=document.getElementById('cfg-status');
    s.style.color='var(--green)'; s.textContent='נשמר בהצלחה!';
    setTimeout(function(){ s.textContent=''; },2000);
    if(proxy) loadLivePrices().then(function(ok){ if(ok){ setLiveBadge(true); refreshActiveTab(); }});
  }catch(e){
    var s=document.getElementById('cfg-status');
    s.style.color='var(--red)'; s.textContent='שגיאה: '+e.message;
  }
}
async function testProxy(){
  var stat=document.getElementById('cfg-test');
  var proxy=document.getElementById('cfg-proxy').value.trim();
  if(!proxy){ stat.style.color='var(--red)'; stat.textContent='הזן כתובת Worker קודם'; return; }
  stat.style.color='var(--muted2)'; stat.textContent='בודק...';
  try{
    var r=await fetch(proxy.replace(/\/+$/,'')+'/?quotes=AAPL',{cache:'no-store'});
    var j=await r.json();
    if(j&&j.AAPL&&j.AAPL.price!=null){
      stat.style.color='var(--green)';
      stat.textContent='AAPL: $'+j.AAPL.price.toFixed(2)+' ('+pct(j.AAPL.chg_pct)+')';
    } else {
      stat.style.color='var(--red)'; stat.textContent='תגובה לא תקינה מה-Worker';
    }
  }catch(e){ stat.style.color='var(--red)'; stat.textContent='שגיאה: '+e.message; }
}

async function triggerWorkflow(workflow, label){
  var stat=document.getElementById('cfg-wf');
  var token=''; try{ token=(localStorage.getItem('github_token')||'').trim(); }catch(e){}
  if(!token){ stat.style.color='var(--red)'; stat.textContent='שמור טוקן GitHub קודם'; return; }
  stat.style.color='var(--muted2)'; stat.textContent='שולח ' + label + '...';
  try{
    var r=await fetch(
      'https://api.github.com/repos/rotemstainai23/portfolio/actions/workflows/'+workflow+'/dispatches',
      { method:'POST',
        headers:{'Authorization':'token '+token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
        body:JSON.stringify({ref:'main'}) }
    );
    if(r.status===204){
      stat.style.color='var(--green)'; stat.textContent='Workflow ' + label + ' הופעל בענן';
    } else {
      var e={}; try{e=await r.json();}catch(_){}
      stat.style.color='var(--red)'; stat.textContent='שגיאה '+r.status+': '+(e.message||r.statusText);
    }
  }catch(e){ stat.style.color='var(--red)'; stat.textContent='שגיאת רשת: '+e.message; }
}

/* ── Holdings Edit Modal ── */
var _hmEditing = null;

/* קריאת ניהול תיק אחת ל-Worker (מסלול נייד), כולל טוקן ואימות שגיאות */
async function portfolioRemote(payload){
  var proxy = priceProxy();
  if (!proxy) throw new Error('הגדר Worker URL בהגדרות');
  payload.token = (localStorage.getItem('github_token')||'').trim();
  var r = await fetch(proxy.replace(/\/+$/,'') + '/portfolio', {
    method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)
  });
  var j = await r.json();
  if (j.error) throw new Error(j.error);
}

function openHoldingModal(symbol){
  _hmEditing = symbol;
  var isLocal = window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost';
  var msg = $('hm-msg');
  var hasTok = false; try { hasTok = !!(localStorage.getItem('github_token')||'').trim(); } catch(e){}
  msg.textContent = (isLocal || (priceProxy() && hasTok)) ? '' : 'הגדר Worker URL וטוקן GitHub בהגדרות לשמירה מהנייד';
  msg.style.color = 'var(--orange)';
  $('hm-delete-btn').style.display = symbol ? 'block' : 'none';
  $('hm-title').textContent = symbol ? 'עדכן — ' + symbol : 'הוסף אחזקה';
  if (symbol) {
    var hd = (_port && _port.holdings || []).find(function(h){ return (h.symbol||h.ticker) === symbol; }) || {};
    $('hm-symbol').value = symbol; $('hm-symbol').readOnly = true;
    $('hm-name').value = hd.name || '';
    $('hm-quantity').value = hd.quantity != null ? hd.quantity : '';
    $('hm-buy_price').value = hd.buy_price != null ? hd.buy_price : '';
    $('hm-layer').value = hd.layer || 'Growth';
    $('hm-sector').value = hd.sector || '';
    $('hm-notes').value = hd.notes || '';
  } else {
    ['hm-symbol','hm-name','hm-quantity','hm-buy_price','hm-sector','hm-notes'].forEach(function(id){ $(id).value = ''; });
    $('hm-symbol').readOnly = false;
    $('hm-layer').value = 'Growth';
  }
  $('holding-modal').style.display = 'flex';
  document.body.style.overflow = 'hidden';
}
function closeHoldingModal(){
  $('holding-modal').style.display = 'none';
  document.body.style.overflow = '';
}
async function saveHolding(){
  var msg = $('hm-msg');
  var sym = ($('hm-symbol').value||'').trim().toUpperCase();
  if (!sym){ msg.style.color='var(--red)'; msg.textContent='חסר טיקר'; return; }
  var body = {
    symbol: sym,
    name: ($('hm-name').value||'').trim() || sym,
    quantity: parseFloat($('hm-quantity').value) || 0,
    buy_price: parseFloat($('hm-buy_price').value) || 0,
    layer: $('hm-layer').value,
    sector: ($('hm-sector').value||'').trim(),
    notes: ($('hm-notes').value||'').trim(),
  };
  var isLocal = window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost';
  msg.style.color='var(--muted2)'; msg.textContent='שומר...';
  try {
    if (isLocal) {
      var r = await fetch('http://127.0.0.1:5000/api/holdings', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
      if (!r.ok) throw new Error(await r.text());
    } else {
      await portfolioRemote({ action: _hmEditing ? 'update' : 'add', holding: body });
    }
    if (!_port.holdings) _port.holdings = [];
    var idx = _port.holdings.findIndex(function(h){ return (h.symbol||h.ticker)===sym; });
    if (idx >= 0) Object.assign(_port.holdings[idx], body);
    else _port.holdings.push(body);
    closeHoldingModal(); renderHoldings();
  } catch(e){ msg.style.color='var(--red)'; msg.textContent='שגיאה: '+e.message; }
}
async function deleteHolding(){
  var msg = $('hm-msg');
  if (!_hmEditing || !confirm('למחוק את ' + _hmEditing + ' מהתיק?')) return;
  var isLocal = window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost';
  msg.style.color='var(--muted2)'; msg.textContent='מוחק...';
  try {
    if (isLocal) {
      var r = await fetch('http://127.0.0.1:5000/api/holdings/' + _hmEditing, {method:'DELETE'});
      if (!r.ok) throw new Error(await r.text());
    } else {
      await portfolioRemote({ action:'remove', symbol: _hmEditing });
    }
    _port.holdings = (_port.holdings||[]).filter(function(h){ return (h.symbol||h.ticker)!==_hmEditing; });
    closeHoldingModal(); renderHoldings();
  } catch(e){ msg.style.color='var(--red)'; msg.textContent='שגיאה: '+e.message; }
}

/* ── register service worker ── */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(function(){});
}

/* ── boot ── */
_loaded['daily'] = true;
importSettingsFromHash();
loadAll();
</script>

        </div>
      </div>
      <div>
        <label style="font-size:11px;font-weight:700;color:var(--muted2,#94a3b8);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px">שכבה</label>
        <select id="hm-layer" style="width:100%;background:rgba(20,30,55,.95);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:10px 12px;color:var(--text,#e2e8f0);font-size:14px;font-family:inherit;box-sizing:border-box">
          <option value="Growth">Growth — צמיחה</option>
          <option value="Stability">Stability — יציבות</option>
          <option value="Speculation">Speculation — ספקולציה</option>
          <option value="Core">Core — ליבה</option>

      <div>
        <label style="font-size:11px;font-weight:700;color:var(--muted2,#94a3b8);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px">סקטור</label>
        <input id="hm-sector" type="text" placeholder="AI / Semiconductors" style="width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:10px 12px;color:var(--text,#e2e8f0);font-size:14px;font-family:inherit;box-sizing:border-box">
      </div>
      <div>
        <label style="font-size:11px;font-weight:700;color:var(--muted2,#94a3b8);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px">הערות</label>
