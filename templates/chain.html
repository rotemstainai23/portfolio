<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>שרשרת סוכנים</title>
<link rel="stylesheet" href="_shared.css">
<link rel="stylesheet" href="_redesign.css">
<style>
.chain-header{padding:22px 20px 16px;background:linear-gradient(135deg,rgba(139,92,246,.12),rgba(245,158,11,.06));border-bottom:1px solid var(--glass-border);margin-bottom:20px}
.chain-back{font-size:13px;color:var(--brand-purple);text-decoration:none;display:inline-flex;align-items:center;gap:5px;margin-bottom:14px;font-weight:700}
.chain-ticker{font-size:30px;font-weight:900;color:var(--text);letter-spacing:-1px}
.chain-meta{font-size:12px;color:var(--muted2);margin-top:4px}
.chain-ic-row{display:inline-flex;align-items:center;gap:10px;margin-top:12px;padding:8px 14px;background:var(--glass);border:1px solid var(--glass-border);border-radius:12px}
.agent-grid{display:flex;flex-direction:column;gap:14px;padding:0 16px 32px}
.agent-card{background:var(--glass);border:1px solid var(--glass-border);border-radius:16px;overflow:hidden}
.agent-head{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--glass-border)}
.agent-name{font-size:14px;font-weight:800;color:var(--text);display:flex;align-items:center;gap:8px}
.agent-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.agent-verdict{font-size:11px;font-weight:700;padding:4px 10px;border-radius:10px;border:1px solid}
.v-buy{color:#34d399;border-color:rgba(52,211,153,.35);background:rgba(52,211,153,.10)}
.v-watchlist{color:#f59e0b;border-color:rgba(245,158,11,.35);background:rgba(245,158,11,.10)}
.v-pass,.v-sell{color:#fb7185;border-color:rgba(251,113,133,.35);background:rgba(251,113,133,.10)}
.v-none{color:var(--muted);border-color:var(--glass-border)}
.agent-body{padding:14px 16px}
.agent-score-row{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.agent-dial{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;position:relative;flex-shrink:0}
.agent-dial::before{content:'';position:absolute;inset:8px;border-radius:50%;background:radial-gradient(circle at 50% 30%,rgba(28,38,64,.95),rgba(8,13,26,.98))}
.agent-dial .dn{position:relative;font-size:20px;font-weight:900;color:var(--text);font-family:'Fira Code',monospace;line-height:1}
.agent-dial .dd{position:relative;font-size:9px;color:var(--muted)}
.agent-thesis{font-size:13px;color:var(--muted2);line-height:1.75;word-break:break-word}
.agent-thesis h3,.agent-thesis h4{color:var(--text);font-size:13px;font-weight:800;margin:8px 0 3px}
.agent-error{display:flex;align-items:center;gap:10px;padding:14px 16px;font-size:13px;color:var(--muted2)}
.err-dot{width:7px;height:7px;border-radius:50%;background:rgba(251,113,133,.45);flex-shrink:0}
.md-table{width:100%;border-collapse:collapse;margin:10px 0;font-size:12px}
.md-table th{color:var(--text);font-weight:800;text-align:right;padding:6px 8px;border-bottom:1px solid var(--glass-border);background:rgba(148,163,184,.06)}
.md-table td{padding:6px 8px;border-bottom:1px solid var(--glass-border);color:var(--muted2)}
.md-li{padding:2px 0 2px 4px}
.consensus{margin:0 16px 14px;overflow-x:auto}
</style>
</head>
<body>
<div id="root" style="min-height:100vh">
  <div style="text-align:center;padding:60px 20px;color:var(--muted2)">טוען נתוני שרשרת...</div>
</div>
<script>
'use strict';
/* סינון קלט: רק תווי טיקר חוקיים, מונע הזרקת HTML מהכתובת */
var ticker = (new URLSearchParams(location.search).get('ticker') || '').toUpperCase().replace(/[^A-Z0-9.\-]/g, '').slice(0, 10);
if (!ticker) {
  document.getElementById('root').innerHTML = '<div style="padding:40px;text-align:center;color:var(--muted2)">חסר טיקר בכתובת (?ticker=XXX)</div>';
} else {
  document.title = 'שרשרת — ' + ticker;
  fetch('../analyses/_chain/' + ticker + '/chain.json?t=' + Date.now())
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(render)
    .catch(function(){
      document.getElementById('root').innerHTML =
        '<div style="padding:40px;text-align:center;color:var(--muted2)">לא נמצאו נתוני שרשרת עבור <b>' + ticker + '</b></div>';
    });
}

var AGENTS = [
  {key:'analyst',  label:'אנליסט',        color:'#60a5fa'},
  {key:'devils',   label:'עורך דין שטן',  color:'#fb7185'},
  {key:'ceo',      label:'CEO',            color:'#a78bfa'},
  {key:'executor', label:'Executor',        color:'#f59e0b'},
  {key:'ic',       label:'ועדת השקעות',   color:'#34d399'},
];

function extractScore(text){
  if (!text) return null;
  var m = text.match(/ציון[^:\n]{0,20}[:\s]+(\d+(?:\.\d+)?)\s*\/\s*10/);
  return m ? parseFloat(m[1]) : null;
}
function extractVerdict(text){
  if (!text) return null;
  var m = text.match(/VERDICT\W{0,4}(BUY|SELL|PASS|WATCHLIST|NO[_ ]?ACTION)/i);
  if (m) return m[1].toUpperCase().replace(' ','_');
  /* גבולות מילה: buy_price ו"מסקנה" לא נתפסים */
  var all = text.match(/\b(BUY|SELL|PASS|WATCHLIST|NO[_ ]?ACTION)\b/gi);
  if (all) return all[all.length-1].toUpperCase().replace(' ','_');
  if (text.includes('מעקב')) return 'WATCHLIST';
  return null;
}
function isError(text){ return !text || (text.startsWith('[') && text.includes('לא התקבל')); }

function mdTable(rows){
  /* שורת מפריד (|---|---|) נזרקת */
  rows = rows.filter(function(r){ return !/^\s*\|?[\s\-:|]+\|?\s*$/.test(r); });
  var html = '<table class="md-table">';
  rows.forEach(function(r, idx){
    var cells = r.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|');
    var tag = idx === 0 ? 'th' : 'td';
    html += '<tr>' + cells.map(function(c){
      return '<'+tag+'>' + c.trim().replace(/\*\*(.+?)\*\*/g,'<b>$1</b>') + '</'+tag+'>';
    }).join('') + '</tr>';
  });
  return html + '</table>';
}

function fmtMd(text){
  if (!text) return '';
  var esc = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  /* חילוץ בלוקי טבלה לפני שאר העיבוד, כדי ש-<br> לא ישבור אותם */
  var lines = esc.split('\n'), out = [], i = 0;
  while (i < lines.length){
    if (/^\s*\|/.test(lines[i])) {
      var tbl = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) { tbl.push(lines[i]); i++; }
      out.push(mdTable(tbl));
      continue;
    }
    out.push(lines[i]); i++;
  }
  return out.join('\n')
    .replace(/^####\s+(.+)$/gm,'<h4>$1</h4>')
    .replace(/^###\s+(.+)$/gm,'<h3>$1</h3>')
    .replace(/^##\s+(.+)$/gm,'<h3>$1</h3>')
    .replace(/^\s*[\*\-]\s+(.+)$/gm,'<div class="md-li">• $1</div>')
    .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
    .replace(/(<\/table>)\n/g,'$1')
    .replace(/\n{2,}/g,'</p><p style="margin:0 0 6px">')
    .replace(/\n/g,'<br>');
}
function scColor(sc){ return sc >= 7 ? '#34d399' : sc >= 5 ? '#f59e0b' : '#fb7185'; }
function verdictCls(v){
  if (!v) return 'v-none';
  if (v === 'BUY') return 'v-buy';
  if (v === 'WATCHLIST') return 'v-watchlist';
  if (v === 'PASS' || v === 'SELL') return 'v-pass';
  return 'v-none';
}

function render(data){
  var icV = data.ic_verdict, icS = data.ic_score;
  var date = (data.generated || '').slice(0, 10);

  var icBadge = '<div class="chain-ic-row">';
  if (icS != null) icBadge += '<span style="font-size:18px;font-weight:900;color:' + scColor(icS) + '">' + icS + '/10</span>';
  if (icV) icBadge += '<span class="agent-verdict ' + verdictCls(icV) + '">' + icV + '</span>';
  if (!icV && icS == null) icBadge += '<span style="font-size:12px;color:var(--muted2)">IC טרם הושלם</span>';
  icBadge += '</div>';

  var html = '<div class="chain-header">'
    + '<a class="chain-back" href="javascript:history.back()">← חזרה</a>'
    + '<div class="chain-ticker">' + ticker + '</div>'
    + '<div class="chain-meta">' + date + ' · שרשרת 5 סוכני ענן Groq</div>'
    + icBadge
    + '</div>';

  /* טבלת קונצנזוס: ורדיקט וציון של כל סוכן במבט אחד */
  var consRows = AGENTS.map(function(ag){
    var rev = (data.reviews || {})[ag.key] || {};
    var raw = (data.agents || {})[ag.key] || '';
    if (isError(raw)) return '<tr><td>' + ag.label + '</td><td colspan="2" style="color:var(--muted)">שגיאה</td></tr>';
    var v = rev.verdict || extractVerdict(raw);
    var s = (rev.score != null) ? rev.score : extractScore(raw);
    return '<tr>'
      + '<td style="font-weight:800;color:' + ag.color + '">' + ag.label + '</td>'
      + '<td><span class="agent-verdict ' + verdictCls(v) + '">' + (v || '—') + '</span></td>'
      + '<td style="font-weight:800;color:' + (s != null ? scColor(s) : 'var(--muted)') + '">' + (s != null ? s + '/10' : '—') + '</td>'
      + '</tr>';
  }).join('');
  html += '<div class="consensus"><table class="md-table">'
    + '<tr><th>סוכן</th><th>ורדיקט</th><th>ציון</th></tr>' + consRows
    + '</table></div>';

  html += '<div class="agent-grid">';
  AGENTS.forEach(function(ag){
    var rev = (data.reviews || {})[ag.key] || {};
    var rawText = (data.agents || {})[ag.key] || '';
    var errored = isError(rawText);

    var score = (rev.score != null) ? rev.score : extractScore(rawText);
    var verdict = rev.verdict || extractVerdict(rawText);

    html += '<div class="agent-card">';
    html += '<div class="agent-head">'
      + '<div class="agent-name"><div class="agent-dot" style="background:' + ag.color + '"></div>' + ag.label + '</div>'
      + '<span class="agent-verdict ' + (errored ? 'v-none' : verdictCls(verdict)) + '">'
      + (errored ? 'שגיאת Groq' : (verdict || '—')) + '</span>'
      + '</div>';

    if (errored) {
      html += '<div class="agent-error"><div class="err-dot"></div>לא התקבל פלט — מגבלת קצב Groq</div>';
    } else {
      html += '<div class="agent-body">';
      if (score != null) {
        var pct = Math.min(score * 10, 100);
        html += '<div class="agent-score-row">'
          + '<div class="agent-dial" style="background:conic-gradient(' + ag.color + ' ' + pct + '%, var(--glass) 0)">'
          + '<span class="dn">' + score + '</span><span class="dd">/10</span>'
          + '</div>'
          + '<div><div style="font-size:12px;color:var(--muted2);margin-bottom:2px">ציון</div>'
          + '<div style="font-size:22px;font-weight:900;color:' + scColor(score) + ';font-family:\'Fira Code\',monospace">' + score + '<span style="font-size:13px;color:var(--muted)"> / 10</span></div>'
          + '</div>'
          + '</div>';
      }
      /* הפלט המלא של הסוכן; thesis הקטום הוא רק גיבוי */
      var body = rawText || rev.thesis || '';
      html += '<div class="agent-thesis"><p style="margin:0 0 6px">' + fmtMd(body) + '</p></div>';
      html += '</div>';
    }
    html += '</div>';
  });
  html += '</div>';
  document.getElementById('root').innerHTML = html;
}
</script>
</body>
</html>
