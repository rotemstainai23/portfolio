<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>דוח יומי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #080d1a;
  --surface: #0e1528;
  --surface2: rgba(14,21,40,.75);
  --border: rgba(148,163,184,.07);
  --border2: rgba(148,163,184,.13);
  --glass: rgba(148,163,184,.055);
  --glass-border: rgba(148,163,184,.09);
  --text: #e2e8f5;
  --muted: #64748b;
  --muted2: #94a3b8;
  --blue: #8b5cf6;
  --green: #34d399;
  --red: #fb7185;
  --orange: #f59e0b;
  --yellow: #fbbf24;
  --grad-brand: linear-gradient(135deg,#8b5cf6,#60a5fa);
  --shadow-sm: 0 2px 8px rgba(0,0,0,.35);
  --shadow-md: 0 6px 24px rgba(0,0,0,.45),0 1px 4px rgba(0,0,0,.2);
  --dur: .22s;
  --ease: cubic-bezier(.4,0,.2,1);
}
body {
  background: var(--bg);
  color: var(--text);
  font-family: Heebo, sans-serif;
  font-size: 14px;
  min-height: 100vh;
}

/* Alert bar */
.alert-bar {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 10px;
  padding: 10px 20px;
  font-size: 13px; font-weight: 700;
  border-bottom: 1px solid;
}
.alert-bar.danger {
  background: rgba(251,113,133,.12);
  border-color: rgba(251,113,133,.3);
  color: var(--red);
  box-shadow: 0 0 24px rgba(251,113,133,.1);
}

/* Health summary band */
.health-band {
  display: flex; gap: 0;
  background: var(--surface);
  border-bottom: 2px solid var(--border2);
}
.health-block {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 14px 10px;
  border-left: 1px solid var(--border);
  cursor: default; transition: background var(--dur);
}
.health-block:last-child { border-left: none; }
.health-block:hover { background: var(--glass); }
.h-num { font-size: 26px; font-weight: 900; line-height: 1; }
.h-lbl { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-top: 4px; }
.h-intact .h-num { color: #34d399; }
.h-review .h-num { color: #fbbf24; }
.h-rerun  .h-num { color: #fb7185; }
.h-urgent .h-num { color: #f43f5e; animation: hPulse 1.2s ease infinite; }
@keyframes hPulse { 0%,100%{opacity:1} 50%{opacity:.45} }
.health-stale { font-size: 11px; color: var(--muted); text-align: center; padding: 6px 20px; background: var(--surface); border-bottom: 1px solid var(--border); }

/* KPI strip */
.kpi-strip {
  display: flex; gap: 1px;
  background: var(--border);
  border-bottom: 1px solid var(--border);
}
.kpi-cell {
  flex: 1; padding: 14px 18px;
  background: var(--surface);
  text-align: center;
}
.kpi-cell .val { font-size: 20px; font-weight: 800; }
.kpi-cell .lbl { font-size: 11px; color: var(--muted); margin-top: 3px; }
.up   { color: var(--green); }
.dn   { color: var(--red); }
.flat { color: var(--muted2); }

/* Flow diagram */
.flow-section { padding: 20px 20px 8px; }
.sec-title {
  font-size: 11px; color: var(--muted);
  text-transform: uppercase; letter-spacing: .09em;
  font-weight: 700; margin-bottom: 12px;
}
.flow-row {
  display: flex; align-items: stretch; gap: 0;
  overflow-x: auto; padding-bottom: 4px;
}
.flow-node {
  background: var(--glass);
  backdrop-filter: blur(20px);
  border: 1px solid var(--glass-border);
  border-radius: 14px;
  padding: 12px 16px;
  min-width: 130px; flex-shrink: 0;
}
.flow-node-title { font-size: 10px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
.flow-node-val   { font-size: 14px; font-weight: 800; }
.flow-node-sub   { font-size: 11px; color: var(--muted2); margin-top: 3px; }
.flow-arrow { display: flex; align-items: center; padding: 0 8px; color: var(--muted); font-size: 18px; flex-shrink: 0; }

/* Holdings grid */
.section-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 20px 10px;
}
.daily-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 14px; padding: 0 20px 20px;
}

/* Card */
.daily-card {
  background: var(--glass);
  backdrop-filter: blur(30px) saturate(180%);
  border: 1px solid var(--glass-border);
  border-radius: 18px; padding: 16px;
  position: relative; overflow: hidden;
  transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
  display: flex; flex-direction: column; gap: 0;
}
.daily-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
.daily-card.alert-card  { border-color: rgba(251,113,133,.35); box-shadow: 0 0 20px rgba(251,113,133,.07); }
.daily-card.review-card { border-color: rgba(251,191,36,.25); }
.daily-card.rerun-card  { border-color: rgba(251,113,133,.4); }
.daily-card.urgent-card { border-color: rgba(244,63,94,.5); box-shadow: 0 0 28px rgba(244,63,94,.1); }

/* Card top row */
.card-top {
  display: flex; align-items: flex-start;
  justify-content: space-between; margin-bottom: 6px;
}
.card-identity .card-ticker  { font-size: 18px; font-weight: 900; line-height: 1; }
.card-identity .card-sector  { font-size: 10px; color: var(--muted2); margin-top: 3px; }
.card-right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.card-price-val { font-size: 15px; font-weight: 700; }
.card-chg       { font-size: 14px; font-weight: 800; }

/* Health badge inline */
.health-badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em;
  padding: 3px 9px; border-radius: 20px; border: 1px solid; white-space: nowrap;
}
.hb-intact { color: #34d399; border-color: rgba(52,211,153,.3);  background: rgba(52,211,153,.08); }
.hb-review { color: #fbbf24; border-color: rgba(251,191,36,.3);  background: rgba(251,191,36,.08); }
.hb-rerun  { color: #fb7185; border-color: rgba(251,113,133,.35); background: rgba(251,113,133,.09); }
.hb-urgent { color: #f43f5e; border-color: rgba(244,63,94,.4);   background: rgba(244,63,94,.09); animation: hPulse 1.2s ease infinite; }

/* Day change bar */
.chg-bar-wrap { height: 4px; background: rgba(255,255,255,.06); border-radius: 4px; overflow: hidden; margin: 8px 0; }
.chg-bar-fill { height: 100%; border-radius: 4px; width: 0; transition: width .9s cubic-bezier(.34,1.56,.64,1) .2s; }
.chg-bar-fill.up   { background: linear-gradient(90deg,#34d399,#6ee7b7); }
.chg-bar-fill.dn   { background: linear-gradient(90deg,#fb7185,#fca5a5); }
.chg-bar-fill.flat { background: rgba(148,163,184,.3); }

/* RSI ring */
.metrics-row { display: flex; align-items: center; gap: 12px; margin: 10px 0 6px; }
.rsi-ring {
  width: 46px; height: 46px; border-radius: 50%;
  display: grid; place-items: center;
  flex-shrink: 0; position: relative;
}
.rsi-ring::before { content: ''; position: absolute; inset: 7px; border-radius: 50%; background: var(--surface); }
.rsi-num  { position: relative; font-size: 12px; font-weight: 900; z-index: 1; }
.rsi-lbl  { font-size: 10px; color: var(--muted); text-align: center; margin-top: 3px; }

/* 52w bar */
.w52-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 10px; color: var(--muted); }
.w52-track { flex: 1; height: 3px; background: rgba(255,255,255,.06); border-radius: 3px; overflow: hidden; }
.w52-fill  { height: 100%; background: var(--grad-brand); border-radius: 3px; width: 0; transition: width .8s var(--ease) .4s; }

/* Pills */
.pills { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.pill  { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px; border: 1px solid; }
.pill-vol      { color: var(--blue);   border-color: rgba(139,92,246,.3);  background: rgba(139,92,246,.08); }
.pill-earn-hot { color: var(--orange); border-color: rgba(245,158,11,.3);  background: rgba(245,158,11,.08); }
.pill-earn-mid { color: var(--yellow); border-color: rgba(251,191,36,.3);  background: rgba(251,191,36,.08); }
.pill-earn     { color: var(--muted2); border-color: var(--border2);       background: transparent; }
.pill-upside   { color: var(--green);  border-color: rgba(52,211,153,.3);  background: rgba(52,211,153,.08); }
.pill-alert    { color: var(--red);    border-color: rgba(251,113,133,.35); background: rgba(251,113,133,.08); }
.pill-layer    { color: var(--muted2); border-color: var(--border);        background: transparent; }

/* News section */
.card-divider { height: 1px; background: var(--border); margin: 10px 0; }
.card-section-title { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
.news-list { display: flex; flex-direction: column; gap: 5px; }
.news-item { font-size: 11px; color: var(--muted2); line-height: 1.5; display: flex; gap: 6px; }
.news-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--muted); flex-shrink: 0; margin-top: 5px; }

/* Health info section */
.health-info { margin-top: 2px; }
.health-concern {
  font-size: 12px; line-height: 1.55; padding: 8px 10px;
  border-radius: 10px; margin-bottom: 6px;
}
.hc-ok      { background: rgba(52,211,153,.07);  color: #34d399; border: 1px solid rgba(52,211,153,.15); }
.hc-warn    { background: rgba(251,191,36,.07);  color: #fbbf24; border: 1px solid rgba(251,191,36,.15); }
.hc-bad     { background: rgba(251,113,133,.07); color: #fb7185; border: 1px solid rgba(251,113,133,.18); }
.hc-urgent  { background: rgba(244,63,94,.08);   color: #f43f5e; border: 1px solid rgba(244,63,94,.2); }

.catalyst-row { display: flex; gap: 6px; align-items: flex-start; font-size: 11px; margin-bottom: 4px; }
.catalyst-label { color: var(--muted); flex-shrink: 0; }
.catalyst-val   { color: #60a5fa; line-height: 1.45; }
.action-row { display: flex; gap: 6px; align-items: center; font-size: 11px; }
.action-label { color: var(--muted); flex-shrink: 0; }
.action-tag {
  font-size: 10px; font-weight: 800; padding: 2px 10px;
  border-radius: 6px; border: 1px solid;
}
.act-hold    { color: #34d399; border-color: rgba(52,211,153,.3);  background: rgba(52,211,153,.08); }
.act-monitor { color: #fbbf24; border-color: rgba(251,191,36,.3);  background: rgba(251,191,36,.08); }
.act-analyze { color: #fb7185; border-color: rgba(251,113,133,.35); background: rgba(251,113,133,.09); }
.act-trim    { color: #f43f5e; border-color: rgba(244,63,94,.4);   background: rgba(244,63,94,.09); }

/* Sector heatmap */
.sector-row { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 20px 20px; }
.sector-pill {
  border-radius: 20px; padding: 7px 14px;
  font-size: 12px; font-weight: 700;
  border: 1px solid transparent;
  transition: transform .2s; cursor: default;
}
.sector-pill:hover { transform: scale(1.04); }

/* Groq panel */
.groq-panel {
  margin: 0 20px 20px; padding: 18px 20px;
  background: linear-gradient(135deg,rgba(139,92,246,.08),rgba(96,165,250,.04));
  border: 1px solid rgba(139,92,246,.3);
  border-top: 3px solid var(--blue);
  border-radius: 16px;
}
.groq-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.groq-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--blue); animation: gPulse 2s ease infinite; }
@keyframes gPulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(1.35)} }
.groq-title { font-size: 13px; font-weight: 800; background: var(--grad-brand); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
.groq-bullet { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-bottom: 1px solid rgba(139,92,246,.1); font-size: 13px; color: var(--muted2); line-height: 1.65; opacity: 0; animation: insightReveal .5s var(--ease) forwards; }
.groq-bullet:last-child { border-bottom: none; }
.groq-bdot { width: 6px; height: 6px; border-radius: 50%; background: var(--blue); flex-shrink: 0; margin-top: 7px; }
@keyframes insightReveal { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }

/* Watchlist triggers */
.triggers-list { padding: 0 20px 20px; }
.trigger-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 12px; background: var(--glass); border: 1px solid var(--glass-border); border-right: 3px solid var(--orange); margin-bottom: 8px; font-size: 13px; }
.trigger-ticker { font-weight: 800; min-width: 56px; }
.trigger-dist   { margin-right: auto; font-weight: 700; }

/* Empty state */
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 70px 20px; color: var(--muted); text-align: center; gap: 12px; }
.empty-state .icon { font-size: 40px; }
.empty-state .msg  { font-size: 15px; font-weight: 700; color: var(--muted2); }
.empty-state .sub  { font-size: 12px; }

@media (max-width: 480px) {
  .daily-grid { grid-template-columns: 1fr; padding: 0 12px 20px; }
  .flow-section { padding: 14px 12px 6px; }
  .health-band .h-num { font-size: 20px; }
}
</style>
</head>
<body>
<div id="root">
  <div class="empty-state">
    <div class="icon">⏳</div>
    <div class="msg">טוען דוח יומי…</div>
  </div>
</div>

<script>
var HEALTH_STATUS_HE = { INTACT: 'בסדר גמור', REVIEW: 'עקוב מקרוב', RERUN: 'נדרש ניתוח מחדש', URGENT: 'דחוף' };
var HEALTH_BADGE_CLS = { INTACT: 'hb-intact', REVIEW: 'hb-review', RERUN: 'hb-rerun', URGENT: 'hb-urgent' };
var HEALTH_CONCERN_CLS = { INTACT: 'hc-ok', REVIEW: 'hc-warn', RERUN: 'hc-bad', URGENT: 'hc-urgent' };
var HEALTH_CARD_CLS = { REVIEW: 'review-card', RERUN: 'rerun-card', URGENT: 'urgent-card' };
var HEALTH_ICON = { INTACT: '🟢', REVIEW: '🟡', RERUN: '🔴', URGENT: '🚨' };
var ACTION_HE = { HOLD: 'החזק', MONITOR_CLOSELY: 'עקוב מקרוב', FULL_ANALYSIS: 'ניתוח מלא', TRIM: 'שקול מכירה' };
var ACTION_CLS = { HOLD: 'act-hold', MONITOR_CLOSELY: 'act-monitor', FULL_ANALYSIS: 'act-analyze', TRIM: 'act-trim' };

function pct(v, dec) {
  dec = dec ?? 1;
  if (v == null) return '—';
  return (v > 0 ? '+' : '') + Number(v).toFixed(dec) + '%';
}
function rsiColor(v) {
  if (v == null) return 'var(--muted)';
  if (v <= 35)   return '#34d399';
  if (v >= 65)   return '#fb7185';
  return '#f59e0b';
}
function sectorBg(avg) {
  if (avg == null) return 'rgba(148,163,184,.1)';
  var a = Math.min(0.06 + Math.abs(avg) * 0.03, 0.25);
  return avg > 0 ? 'rgba(52,211,153,' + a + ')' : 'rgba(251,113,133,' + a + ')';
}
function sectorBorder(avg) {
  if (avg == null) return 'var(--border2)';
  var a = Math.min(0.2 + Math.abs(avg) * 0.04, 0.6);
  return avg > 0 ? 'rgba(52,211,153,' + a + ')' : 'rgba(251,113,133,' + a + ')';
}
function daysDiff(dateStr) {
  if (!dateStr) return Infinity;
  var d = new Date(dateStr);
  var now = new Date();
  return Math.round((now - d) / 86400000);
}
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function render(D, healthData) {
  var healthMap = {};
  if (healthData && healthData.results) {
    healthData.results.forEach(function(r) { healthMap[r.ticker] = r; });
  }

  var upCount = D.holdings.filter(function(h){ return (h.chg_pct||0) > 0; }).length;
  var dnCount = D.holdings.filter(function(h){ return (h.chg_pct||0) < 0; }).length;
  var avgChg  = D.holdings.reduce(function(s,h){ return s + (h.chg_pct||0); }, 0) / (D.holdings.length || 1);

  var topSectors = D.sector_summary.slice().sort(function(a,b){ return Math.abs(b.avg_chg_pct) - Math.abs(a.avg_chg_pct); });
  var topMover   = D.holdings.slice().sort(function(a,b){ return Math.abs(b.chg_pct||0) - Math.abs(a.chg_pct||0); })[0];
  var actionText  = D.has_alerts ? D.alert_tickers.join(', ') + ' לבדיקה'
                  : (D.watchlist_triggers||[]).length ? "טריגר וואצ'ליסט"
                  : 'ללא פעולה';
  var actionColor = D.has_alerts ? 'var(--red)' : (D.watchlist_triggers||[]).length ? 'var(--orange)' : 'var(--green)';

  var h = '';

  /* ── Alert bar ── */
  if (D.has_alerts) {
    h += '<div class="alert-bar danger">'
      + '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>'
      + 'נדרשת בדיקה: ' + escHtml(D.alert_tickers.join(' · '))
      + '</div>';
  }

  /* ── Health summary band ── */
  if (healthData && healthData.summary) {
    var s = healthData.summary;
    var ageDays = daysDiff(healthData.run_date);
    h += '<div class="health-band">'
      + '<div class="health-block h-intact"><div class="h-num">' + (s.intact||0) + '</div><div class="h-lbl">🟢 בסדר</div></div>'
      + '<div class="health-block h-review"><div class="h-num">' + (s.review||0) + '</div><div class="h-lbl">🟡 עקוב</div></div>'
      + '<div class="health-block h-rerun"><div class="h-num">'  + (s.rerun||0)  + '</div><div class="h-lbl">🔴 ניתוח מחדש</div></div>'
      + '<div class="health-block h-urgent"><div class="h-num">' + (s.urgent||0) + '</div><div class="h-lbl">🚨 דחוף</div></div>'
      + '</div>';
    if (ageDays > 7) {
      h += '<div class="health-stale">בריאות לא עדכנית — עודכנה לאחרון ' + escHtml(healthData.run_date) + ' (' + ageDays + ' ימים)</div>';
    }
  }

  /* ── KPI strip ── */
  var avgCls = avgChg > 0.05 ? 'up' : avgChg < -0.05 ? 'dn' : 'flat';
  var cntCls = upCount > dnCount ? 'up' : upCount < dnCount ? 'dn' : 'flat';
  h += '<div class="kpi-strip">'
    + '<div class="kpi-cell"><div class="val">'  + escHtml(D.generated) + '</div><div class="lbl">תאריך</div></div>'
    + '<div class="kpi-cell"><div class="val ' + cntCls + '">' + upCount + ' / ' + dnCount + '</div><div class="lbl">עולות / יורדות</div></div>'
    + '<div class="kpi-cell"><div class="val ' + avgCls + '">' + pct(avgChg) + '</div><div class="lbl">ממוצע שינוי</div></div>'
    + '<div class="kpi-cell"><div class="val">'  + D.holdings.length + '</div><div class="lbl">אחזקות</div></div>'
    + '</div>';

  /* ── Flow diagram ── */
  var macroVal = D.macro && D.macro.spy_chg_pct != null ? pct(D.macro.spy_chg_pct) : 'אין נתון';
  var macroCls = D.macro && D.macro.spy_chg_pct != null ? (D.macro.spy_chg_pct >= 0 ? 'up' : 'dn') : 'flat';
  var sec0     = topSectors[0];
  var secCls   = sec0 && sec0.avg_chg_pct >= 0 ? 'up' : 'dn';
  var mvCls    = topMover && (topMover.chg_pct||0) >= 0 ? 'up' : 'dn';

  h += '<div class="flow-section"><div class="sec-title">תמונת יום המסחר</div>'
    + '<div class="flow-row">'
    + '<div class="flow-node"><div class="flow-node-title">מאקרו</div><div class="flow-node-val ' + macroCls + '">' + macroVal + '</div><div class="flow-node-sub">SPY</div></div>'
    + '<div class="flow-arrow">›</div>'
    + '<div class="flow-node"><div class="flow-node-title">סקטור מוביל</div><div class="flow-node-val ' + secCls + '">' + (sec0 ? escHtml(sec0.sector) : '—') + '</div><div class="flow-node-sub">' + (sec0 ? pct(sec0.avg_chg_pct) : '') + '</div></div>'
    + '<div class="flow-arrow">›</div>'
    + '<div class="flow-node"><div class="flow-node-title">מניה מובילה</div><div class="flow-node-val ' + mvCls + '">' + (topMover ? topMover.ticker : '—') + '</div><div class="flow-node-sub">' + (topMover ? pct(topMover.chg_pct) : '') + '</div></div>'
    + '<div class="flow-arrow">›</div>'
    + '<div class="flow-node"><div class="flow-node-title">פעולה נדרשת</div><div class="flow-node-val" style="color:' + actionColor + '">' + escHtml(actionText) + '</div></div>'
    + '</div></div>';

  /* ── Holdings grid ── */
  h += '<div class="section-header"><div class="sec-title" style="margin:0">אחזקות — ' + escHtml(D.generated_time) + '</div></div>'
    + '<div class="daily-grid">';

  D.holdings.forEach(function(hd) {
    var chgCls = (hd.chg_pct||0) > 0 ? 'up' : (hd.chg_pct||0) < 0 ? 'dn' : 'flat';
    var barW   = Math.min(Math.abs(hd.chg_pct||0) / 5 * 100, 100).toFixed(1);
    var rsiC   = rsiColor(hd.rsi);
    var rsiInt = hd.rsi != null ? Math.round(hd.rsi) : null;
    var hi     = healthMap[hd.ticker] || null;
    var hStatus = hi ? hi.status : null;

    /* card border class */
    var cardCls = 'daily-card';
    if (hd.verdict) cardCls += ' alert-card';
    else if (hStatus && HEALTH_CARD_CLS[hStatus]) cardCls += ' ' + HEALTH_CARD_CLS[hStatus];

    /* health badge */
    var badgeHtml = '';
    if (hStatus) {
      badgeHtml = '<span class="health-badge ' + HEALTH_BADGE_CLS[hStatus] + '">'
        + HEALTH_ICON[hStatus] + ' ' + escHtml(HEALTH_STATUS_HE[hStatus] || hStatus)
        + '</span>';
    }

    /* earnings pill */
    var earnPill = '';
    if (hd.days_to_earnings != null) {
      var ec = hd.days_to_earnings <= 7 ? 'pill-earn-hot' : hd.days_to_earnings <= 14 ? 'pill-earn-mid' : 'pill-earn';
      earnPill = '<span class="pill ' + ec + '">' + hd.days_to_earnings + 'ד לדוח</span>';
    }

    /* RSI ring */
    var rsiBlock = '';
    if (rsiInt != null) {
      rsiBlock = '<div>'
        + '<div class="rsi-ring" style="background:conic-gradient(' + rsiC + ' calc(' + rsiInt + '* 1%),rgba(148,163,184,.07) 0)">'
        + '<span class="rsi-num" style="color:' + rsiC + '">' + rsiInt + '</span>'
        + '</div><div class="rsi-lbl">RSI</div>'
        + '</div>';
    }

    /* 52w bar */
    var w52Block = '';
    if (hd.w52_pos_pct != null) {
      w52Block = '<div class="w52-row">'
        + '<span>52w</span>'
        + '<div class="w52-track"><div class="w52-fill" data-w="' + hd.w52_pos_pct + '" style="width:0"></div></div>'
        + '<span>' + hd.w52_pos_pct + '%</span>'
        + '</div>';
    }

    /* pills */
    var pills = '';
    if (hd.vol_ratio != null && hd.vol_ratio >= 1.5)
      pills += '<span class="pill pill-vol">×' + hd.vol_ratio + ' נפח</span>';
    if (hd.analyst_upside_pct != null && hd.analyst_upside_pct > 5)
      pills += '<span class="pill pill-upside">' + pct(hd.analyst_upside_pct, 0) + ' יעד</span>';
    if (hd.verdict)
      pills += '<span class="pill pill-alert">' + escHtml(hd.verdict) + '</span>';
    pills += earnPill;
    if (hd.layer)
      pills += '<span class="pill pill-layer">' + escHtml(hd.layer) + '</span>';

    /* news section */
    var newsHtml = '';
    if (hd.news && hd.news.length > 0) {
      newsHtml = '<div class="card-divider"></div>'
        + '<div class="card-section-title">📰 חדשות</div>'
        + '<div class="news-list">';
      hd.news.slice(0, 3).forEach(function(n) {
        var label, href;
        if (typeof n === 'object' && n !== null) {
          label = n.title_he || escHtml(n.title || '');
          href  = n.url || '';
        } else {
          label = escHtml(n);
          href  = '';
        }
        var inner = href
          ? '<a href="' + escHtml(href) + '" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline;text-underline-offset:2px;text-decoration-color:rgba(148,163,184,.3)">' + label + '</a>'
          : label;
        newsHtml += '<div class="news-item"><div class="news-dot"></div><div>' + inner + '</div></div>';
      });
      newsHtml += '</div>';
    }

    /* health info section */
    var healthHtml = '';
    if (hi) {
      var concernTxt = (hStatus === 'INTACT') ? 'הכל תקין' : (hi.concern || 'לא פורט');
      var concernCls = HEALTH_CONCERN_CLS[hStatus] || 'hc-ok';
      var actionKey  = hi.action || 'HOLD';
      var actionLbl  = ACTION_HE[actionKey] || actionKey;
      var actionCls  = ACTION_CLS[actionKey] || 'act-hold';

      healthHtml = '<div class="card-divider"></div><div class="health-info">'
        + '<div class="health-concern ' + concernCls + '">'
        + '<strong>💬 מה קורה:</strong> ' + escHtml(concernTxt)
        + '</div>';

      if (hi.next_catalyst) {
        healthHtml += '<div class="catalyst-row">'
          + '<span class="catalyst-label">🗓️ הבא:</span>'
          + '<span class="catalyst-val">' + escHtml(hi.next_catalyst) + '</span>'
          + '</div>';
      }

      healthHtml += '<div class="action-row">'
        + '<span class="action-label">🎯 פעולה:</span>'
        + '<span class="action-tag ' + actionCls + '">' + escHtml(actionLbl) + '</span>'
        + '</div>'
        + '</div>';
    }

    h += '<div class="' + cardCls + '">'
      /* top row */
      + '<div class="card-top">'
      + '<div class="card-identity"><div class="card-ticker">' + escHtml(hd.ticker) + '</div><div class="card-sector">' + escHtml(hd.sector || '') + '</div></div>'
      + '<div class="card-right">'
      + '<div class="card-price-val">' + (hd.price != null ? '$' + hd.price.toFixed(2) : '—') + '</div>'
      + '<div class="card-chg ' + chgCls + '">' + pct(hd.chg_pct) + '</div>'
      + badgeHtml
      + '</div>'
      + '</div>'
      /* change bar */
      + '<div class="chg-bar-wrap"><div class="chg-bar-fill ' + chgCls + '" data-w="' + barW + '" style="width:0"></div></div>'
      /* metrics */
      + '<div class="metrics-row">'
      + rsiBlock
      + '<div style="flex:1">' + w52Block + '<div class="pills">' + pills + '</div></div>'
      + '</div>'
      /* news */
      + newsHtml
      /* health */
      + healthHtml
      + '</div>';
  });
  h += '</div>';

  /* ── Sector heatmap ── */
  if (D.sector_summary.length > 0) {
    h += '<div class="section-header"><div class="sec-title" style="margin:0">סקטורים</div></div><div class="sector-row">';
    D.sector_summary.forEach(function(s) {
      var bg  = sectorBg(s.avg_chg_pct);
      var brd = sectorBorder(s.avg_chg_pct);
      var clr = s.avg_chg_pct >= 0 ? '#34d399' : '#fb7185';
      h += '<div class="sector-pill" style="background:' + bg + ';border-color:' + brd + ';color:' + clr + '">'
        + escHtml(s.sector) + ' <span style="opacity:.65">' + pct(s.avg_chg_pct) + '</span>'
        + '</div>';
    });
    h += '</div>';
  }

  /* ── Groq insights ── */
  if (D.groq_insights && D.groq_insights.length > 0) {
    h += '<div class="groq-panel"><div class="groq-header"><div class="groq-dot"></div><div class="groq-title">תובנות AI יומיות</div></div>';
    D.groq_insights.forEach(function(ins, i) {
      h += '<div class="groq-bullet" style="animation-delay:' + (i * 0.2 + 0.1) + 's">'
        + '<div class="groq-bdot"></div>'
        + '<div>' + escHtml(ins) + '</div>'
        + '</div>';
    });
    h += '</div>';
  }

  /* ── Insider alerts ── */
  if (D.insider_alerts && Object.keys(D.insider_alerts).length > 0) {
    h += '<div class="groq-panel"><div class="groq-header"><div class="groq-dot" style="background:var(--blue)"></div><div class="groq-title">פעילות Insider (SEC Form 4)</div></div>';
    Object.entries(D.insider_alerts).forEach(function([ticker, a], i) {
      var netCls = a.net > 0 ? 'var(--green)' : 'var(--red)';
      var netSign = a.net > 0 ? '+' : '';
      h += '<div class="groq-bullet" style="animation-delay:' + (i * 0.15) + 's">'
        + '<div class="groq-bdot" style="background:var(--blue)"></div>'
        + '<div><b>' + escHtml(ticker) + '</b> ' + escHtml(a.verdict)
        + ' · נטו: <span style="color:' + netCls + '">' + netSign + '$' + Math.round(a.net).toLocaleString() + '</span></div>'
        + '</div>';
    });
    h += '</div>';
  }

  /* ── Watchlist triggers ── */
  if (D.watchlist_triggers && D.watchlist_triggers.length > 0) {
    h += '<div class="section-header"><div class="sec-title" style="margin:0">טריגרים — וואצ\'ליסט</div></div><div class="triggers-list">';
    D.watchlist_triggers.forEach(function(w) {
      var dc = Math.abs(w.distance_pct) < 1 ? 'var(--red)' : 'var(--orange)';
      h += '<div class="trigger-item">'
        + '<span class="trigger-ticker">' + escHtml(w.ticker) + '</span>'
        + '<span style="color:var(--muted2)">טריגר: <b>$' + w.trigger_price.toFixed(2) + '</b></span>'
        + '<span style="color:var(--muted2)">כעת: <b>$' + w.current_price.toFixed(2) + '</b></span>'
        + '<span class="trigger-dist" style="color:' + dc + '">' + pct(w.distance_pct) + '</span>'
        + '</div>';
    });
    h += '</div>';
  }

  document.getElementById('root').innerHTML = h;

  /* animate bars */
  requestAnimationFrame(function() {
    document.querySelectorAll('.chg-bar-fill[data-w]').forEach(function(el) { el.style.width = el.dataset.w + '%'; });
    document.querySelectorAll('.w52-fill[data-w]').forEach(function(el) { el.style.width = el.dataset.w + '%'; });
  });
}

function showError(msg) {
  document.getElementById('root').innerHTML = '<div class="empty-state">'
    + '<div class="icon">📭</div>'
    + '<div class="msg">' + escHtml(msg) + '</div>'
    + '<div class="sub">הדוח מתעדכן אוטומטית ב-5:00 בימי שני–שישי</div>'
    + '</div>';
}

/* טעינת שני מקורות במקביל */
(function() {
  var dailyLoaded = false;
  var healthResult = null;
  var healthDone = false;

  function tryRender() {
    if (dailyLoaded && healthDone) {
      render(window.DAILY_DATA, healthResult);
    }
  }

  /* health API */
  fetch('/api/portfolio/health/latest')
    .then(function(r) { return r.ok ? r.json() : null; })
    .catch(function() { return null; })
    .then(function(data) {
      healthResult = data;
      healthDone = true;
      tryRender();
    });

  /* daily_latest.js */
  var s = document.createElement('script');
  s.src = '../analyses/_daily/daily_latest.js?_=' + Date.now();
  s.onload = function() {
    if (!window.DAILY_DATA) { showError('daily_latest.js נטען אך DAILY_DATA ריק'); return; }
    dailyLoaded = true;
    tryRender();
  };
  s.onerror = function() { showError('אין דוח יומי עדיין'); };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
